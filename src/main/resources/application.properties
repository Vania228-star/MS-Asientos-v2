spring.application.name=msasientos
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

ms-cartelera.url=${MS_CARTELERA_URL:http://localhost:8081}


# Endpoint userInfo de Cognito (para obtener el email cuando el access token no lo trae)
cognito.userinfo-url=${COGNITO_USERINFO_URL:}

# RabbitMQ (addresses = failover: si cae rabbit1, usa rabbit2)
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

# ---------- Kafka (broker 2: log de eventos) ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Productor: confirma con el broker antes de responder (acks=all) e idempotente
# para no duplicar eventos si un envío se reintenta
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumidor: earliest para que un grupo nuevo lea los eventos ya publicados
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
